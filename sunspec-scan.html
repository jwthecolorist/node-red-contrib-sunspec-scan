<script type="text/javascript">
    RED.nodes.registerType('sunspec-scan', {
        category: 'function',
        color: '#f3b567',
        defaults: {
            name: { value: "" },
            ip: { value: "", required: false },
            port: { value: "502", required: true, validate: RED.validators.number() },
            timeout: { value: "2000", required: true, validate: RED.validators.number() },
            pacing: { value: "2", validate: RED.validators.regex(/^[0-9.]*$/) }, // New Pacing Field (Default 2s)
            triggerMode: { value: "auto" },
            unitId: { value: "", required: false },
            scanIds: { value: true },

            readMode: { value: "scan" }, // 'scan', 'parameter', 'list'

            // Single Parameter Mode
            selectedDevice: { value: "" },
            selectedDeviceLabel: { value: "" }, // Persist Label
            selectedModel: { value: "" },
            selectedModelLabel: { value: "" }, // Persist Label
            selectedPoint: { value: "" },
            selectedPointLabel: { value: "" }, // Persist Label
            selectedId: { value: "" },

            // Custom List Mode
            outputList: { value: [] },

            // Output Formatting
            roundDecimals: { value: true },
            filterImplemented: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "bridge.svg",
        label: function () {
            if (this.readMode === 'parameter') {
                return this.name || `Read ${this.selectedPoint || "SunSpec"}`;
            }
            if (this.readMode === 'list') {
                return this.name || `Read List (${this.outputList ? this.outputList.length : 0})`;
            }
            return this.name || "SunSpec Scan";
        },
        oneditprepare: function () {
            try {
                const node = this;
                let currentNetworkMap = {};

                let savedDevices = [];

                // Fetch Server Network Map immediately
                $.getJSON('sunspec-scan/network', function (map) {
                    if (map) currentNetworkMap = map;
                    // Fetch Saved Devices
                    $.getJSON('sunspec-scan/devices', function (devs) {
                        savedDevices = devs || [];
                        populateDeviceSelect();
                        // FIX: Re-trigger mode visibility after async device load
                        setTimeout(function() { $("#node-input-readMode").trigger("change"); }, 50);
                    });
                });

                // Tabs Logic
                const tabs = RED.tabs.create({
                    id: "node-input-sunspec-tabs",
                    onchange: function (tab) {
                        $("#node-input-tabs-content").children().hide();
                        $("#" + tab.id).show();
                    }
                });
                tabs.addTab({
                    id: "sunspec-tab-scanner",
                    label: "Scanner"
                });
                tabs.addTab({
                    id: "sunspec-tab-settings",
                    label: "Settings"
                });

                // Mode Select Handler
                $("#node-input-readMode").on("change", function () {
                    const mode = $(this).val();
                    $(".mode-group").hide();

                    if (mode === "scan") $(".scan-mode-only").show();
                    else if (mode === "parameter") $(".param-mode-only").show();
                    else if (mode === "list") $(".list-mode-only").show();
                });
                // B5 FIX: Trigger initial mode display on editor open
                setTimeout(function() { $("#node-input-readMode").trigger("change"); }, 300);

                // Trigger Mode Select Handler
                $("#node-input-triggerMode").on("change", function () {
                    const tMode = $(this).val();
                    if (tMode === "inject") {
                        $("#pacing-row").hide();
                    } else {
                        $("#pacing-row").show();
                    }
                });
                setTimeout(function() { $("#node-input-triggerMode").trigger("change"); }, 100);

                // "Usable only" defaults on, including for nodes saved before this option existed
                if (node.filterImplemented === undefined) $("#node-input-filterImplemented").prop("checked", true);
                $("#node-input-filterImplemented").on("change", function () {
                    if ($("#node-input-selectedModel").val()) $("#node-input-selectedModel").trigger("change");
                });

                // Collapsible "scan range / manual address" — open by default in Scan mode
                $("#ss-adv-toggle").on("click", function () {
                    $("#ss-adv-body").slideToggle(120);
                    $(this).find(".ss-chev").toggleClass("open");
                });
                function ssSyncAdvanced() {
                    const isScan = $("#node-input-readMode").val() === "scan";
                    $("#ss-adv-body").toggle(isScan);
                    $("#ss-adv-toggle .ss-chev").toggleClass("open", isScan);
                }
                $("#node-input-readMode").on("change", ssSyncAdvanced);
                setTimeout(ssSyncAdvanced, 320);

                // Auto-toggle Scan All based on Unit ID input
                // Deprecated: Logic now handled by parsing Unit ID string directly
                /*
                $("#node-input-unitId").on("input", function() {
                    if ($(this).val().trim() !== "") {
                        $("#node-input-scanIds").prop("checked", false);
                    } else {
                        $("#node-input-scanIds").prop("checked", true);
                    }
                });
                */

                // TABS LOGIC

                // SCAN NETWORK BUTTON
                $("#btn-scan-network").click(function () {
                    const $btn = $(this);
                    const $stopBtn = $("#btn-stop-scan");
                    const $prog = $("#scan-progress-bar");

                    let ip = $("#node-input-ip").val();
                    // Validate port and timeout with sensible defaults
                    let port = parseInt($("#node-input-port").val()) || 502;
                    let timeout = parseInt($("#node-input-timeout").val()) || 2000;
                    const unitId = $("#node-input-unitId").val();

                    // Validate range constraints
                    if (port < 1 || port > 65535) port = 502;
                    if (timeout < 100 || timeout > 30000) timeout = 2000;

                    // Default to All Local if empty
                    if (!ip) ip = "0.0.0.0/0";

                    $prog.show();
                    $btn.hide();
                    $stopBtn.show();
                    $("#scan-status-text").text("Starting scan...");

                    // Polling for Status
                    const statusInterval = setInterval(function () {
                        $.getJSON("sunspec-scan/status", function (data) {
                            if (data.status) $("#scan-status-text").text(data.status);
                        });
                    }, 500);



                    const currentScanRequest = $.ajax({
                        url: "sunspec-scan/discover",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({
                            ip: ip,
                            port: port,
                            unitId: unitId,
                            timeout: timeout
                        }),
                        success: function (results) {
                            clearInterval(statusInterval);
                            $btn.html('<i class="fa fa-search"></i> Scan').prop("disabled", false).show();
                            $stopBtn.hide();
                            $prog.hide();
                            // Refresh Saved Devices list (as auto-save may have occurred)
                            $.getJSON('sunspec-scan/devices', function (devs) {
                                if (devs) savedDevices = devs;
                                populateDeviceSelect(results, port);
                                RED.notify("Network scan complete. Found " + Object.keys(results).length + " devices.", "success");
                            });
                        },
                        error: function (jqXHR, textStatus, errorThrown) {
                            clearInterval(statusInterval);
                            $btn.html('<i class="fa fa-search"></i> Scan').prop("disabled", false).show();
                            $stopBtn.hide();
                            $prog.hide();
                            if (textStatus !== 'abort') {
                                RED.notify("Scan status: " + textStatus, "warning");
                            } else {
                                RED.notify("Scan stopped by user.", "info");
                            }
                        }
                    });

                    // STOP SCAN BUTTON
                    // Unbind previous click to prevent multiple handlers if reopened? No, OnEditPrepare creates fresh DOM.
                    $("#btn-stop-scan").off('click').click(function () {
                        $.post("sunspec-scan/stop", function () {
                            // RED.notify("Stopping scan...", "info"); // XHR abort will trigger "stopped by user"
                        });
                        if (currentScanRequest) {
                            currentScanRequest.abort();
                        }
                    });
                });

                // STOP BUTTON (Initial placeholder, replaced dynamically)
                $("#btn-stop-scan").click(function () {
                    // Fallback if clicked before scan starts? Should remain hidden.
                });

                // Global Cache - REMOVED (Using currentNetworkMap from oneditprepare)

                // --- Dropdown Logic ---

                // Helper: Transform technical name to human-readable label
                function formatLabel(str) {
                    if (!str) return '';
                    // Split by underscore OR CamelCase
                    return str
                        // Insert space before capital letters (that follow lowercase)
                        .replace(/([a-z])([A-Z])/g, '$1 $2')
                        // Split by underscore
                        .split(/[_\s]+/)
                        // Capitalize first letter of words
                        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                        .join(' ');
                }

                let globalModelDefinitions = null;
                $.getJSON('sunspec-scan/models', function (allModels) {
                    globalModelDefinitions = allModels;
                    // If we were waiting to populate, maybe re-trigger? 
                    // Mostly this loads fast enough before user clicks.
                });

                function populateModelsDropdown(models, currentMod) {
                    const $mod = $("#node-input-selectedModel");
                    $mod.empty().append('<option value="">-- Select Model --</option>');

                    // Logic to run population once data available
                    const runPopulate = (allModels) => {
                        const sortedMids = Object.keys(models).sort((a, b) => {
                            const na = parseInt(a);
                            const nb = parseInt(b);
                            if (isNaN(na) && isNaN(nb)) return a.localeCompare(b);
                            if (isNaN(na)) return 1; // Strings at end
                            if (isNaN(nb)) return -1;
                            return na - nb;
                        });
                        sortedMids.forEach(mid => {
                            if (mid === 'info') return;
                            const mDef = allModels[mid];
                            let mName = `Model ${mid}`;
                            if (mDef && mDef.group) {
                                mName = mDef.group.label || mDef.group.name || `Model ${mid}`;
                            }
                            $mod.append($('<option>', { value: mid, text: `${mid} - ${mName}` }));
                        });

                        // Restore Selection
                        let restored = false;
                        if (currentMod && $mod.find(`option[value='${currentMod}']`).length > 0) {
                            $mod.val(currentMod);
                            restored = true;
                        } else if (node.selectedModel && $mod.find(`option[value='${node.selectedModel}']`).length > 0) {
                            $mod.val(node.selectedModel);
                            restored = true;
                        }

                        if (restored) $mod.trigger('change');
                    };

                    if (globalModelDefinitions) {
                        runPopulate(globalModelDefinitions);
                    } else {
                        // Fallback fetch if not ready (rare but possible on refresh)
                        $.getJSON('sunspec-scan/models', function (allModels) {
                            globalModelDefinitions = allModels;
                            runPopulate(allModels);
                        });
                    }
                }

                function populateDeviceSelect(scanResults, scanPort) {
                    const $dev = $("#node-input-selectedDevice");
                    const currentVal = $dev.val();
                    $dev.empty().append('<option value="">-- Select Device --</option>');

                    // Update Local Map from Scan Results.
                    // The server keys its network map as "IP:PORT"; key fresh discover
                    // results the same way so the change-handler lookup stays consistent.
                    if (scanResults) {
                        const sp = scanPort || node.port || 502;
                        for (const ip in scanResults) {
                            currentNetworkMap[`${ip}:${sp}`] = scanResults[ip];
                        }
                    }

                    // 1. Saved Devices Group
                    if (savedDevices.length > 0) {
                        const group = $('<optgroup label="Saved Devices">');
                        savedDevices.forEach(d => {
                            // BUG FIX: Must include port in value so change handler picks it up
                            // Format: IP:PORT:UNITID
                            // Format: IP:PORT:UNITID
                            const dPort = d.port || 502;
                            const val = `${d.ip}:${dPort}:${d.unitId}`;
                            // Use saved name or format
                            group.append($('<option>', { value: val, text: d.name, 'data-port': dPort }));
                        });
                        $dev.append(group);
                    }

                    // 2. Network/Discovered Devices
                    const netGroup = $('<optgroup label="Network Scan">');
                    let hasNet = false;

                    Object.keys(currentNetworkMap).forEach(function (mapKey) {
                        const idMap = currentNetworkMap[mapKey];
                        if (!idMap) return;

                        // Server keys entries as "IP:PORT". Derive ip + port from the key
                        // (tolerating a bare "IP" key). Re-using node.port here was the bug:
                        // for an "IP:PORT" key it built malformed 4-part device values like
                        // "192.168.5.29:502:502:1", breaking the model lookup and deep-scanning
                        // a bad IP -> empty Model dropdown.
                        let ip = mapKey;
                        let port = node.port || 502;
                        const li = mapKey.lastIndexOf(':');
                        if (li > -1 && /^\d+$/.test(mapKey.slice(li + 1))) {
                            ip = mapKey.slice(0, li);
                            port = mapKey.slice(li + 1);
                        }

                        Object.keys(idMap).forEach(function (id) {
                            // Already in saved devices? (match IP + port + unit id)
                            const isSaved = savedDevices.some(s => s.ip === ip && s.unitId == id && (s.port || 502) == port);
                            if (isSaved) return;

                            const models = idMap[id];
                            let label = "";
                            let combinedModel = "";

                            if (models && models.info) {
                                const mn = models.info.Mn || "";
                                const md = models.info.Md || "";
                                if (mn || md) label = `${mn} ${md}`;
                            }

                            if (!label) label = `Unknown Device`;

                            if (models) {
                                const mList = Object.keys(models).filter(m => m !== 'info').join(', ');
                                if (mList) combinedModel = `(Models: ${mList})`;
                            }

                            const text = `${ip}:${id} - ${label} ${combinedModel}`;
                            netGroup.append($('<option>', { value: `${ip}:${port}:${id}`, text: text }));
                            hasNet = true;
                        });
                    });

                    if (hasNet) $dev.append(netGroup);

                    // If currently selected is NOT in list (ghost), add it
                    if (node.selectedDevice) {
                        const exists = $dev.find(`option[value='${node.selectedDevice}']`).length > 0;
                        if (!exists) {
                            const ghostLabel = node.selectedDeviceLabel || node.selectedDevice;
                            $dev.append($('<option>', { value: node.selectedDevice, text: ghostLabel, selected: true }));
                        }
                    }

                    if (currentVal) {
                        $dev.val(currentVal).trigger('change');
                    } else if (node.selectedDevice) {
                        $dev.val(node.selectedDevice).trigger('change');
                    }
                }



                // Initial Populate on Open (Call ONCE)
                populateDeviceSelect(null);

                // Devices -> Models (LAZY LOADING)
                $("#node-input-selectedDevice").change(function () {
                    const dev = $(this).val();

                    // Save Label
                    const label = $(this).find("option:selected").text();
                    if (dev) node.selectedDeviceLabel = label;

                    const $mod = $("#node-input-selectedModel");
                    const currentMod = $mod.val();
                    $mod.empty().append('<option value="">-- Select Model --</option>');

                    // Also Reset Point Dropdown
                    $("#node-input-selectedPoint").empty().append('<option value="">-- Select Point --</option>');

                    if (dev) {
                        // dev format can be:
                        // 1. "IP:PORT:ID" (New, e.g. 172.17.0.11:503:126)
                        // 2. "IP:ID" (Legacy/Default, e.g. 192.168.1.10:126)
                        const parts = dev.split(':');
                        const id = parts.pop();

                        let port = "502";
                        let ip = "";

                        if (parts.length > 1) {
                            // Was 3 parts: IP, Port, ID -> Remaining: IP, Port
                            port = parts.pop();
                            ip = parts.join(':');
                        } else if (parts.length === 1) {
                            // Was 2 parts: IP, ID -> Remaining: IP
                            ip = parts[0];
                        }

                        // Check for data-port override (Saved Devices)
                        const opt = $(this).find("option:selected");
                        if (opt.data('port')) {
                            port = opt.data('port');
                        }

                        const deviceKey = `${ip}:${port}`;

                        const cache = currentNetworkMap;

                        if (port === "503") {
                        }

                        $("#node-input-selectedId").val(id);

                        // CHECK IF MODELS LOADED
                        const deviceData = (cache[deviceKey] && cache[deviceKey][id]) ? cache[deviceKey][id] : null;

                        if (!deviceData || Object.keys(deviceData).length <= 2) {
                            // LAZY LOAD TRIGGER
                            $mod.append('<option value="" disabled>Loading models (deep scanning)...</option>');
                            // B4 FIX: Use the parsed port from selectedDevice, not the Settings tab port
                            const lazyPort = port;
                            const timeout = $("#node-input-timeout").val();

                            $.ajax({
                                url: "sunspec-scan/scan-models",
                                type: "POST",
                                contentType: "application/json",
                                data: JSON.stringify({
                                    ip: ip,
                                    port: parseInt(lazyPort),
                                    unitId: id,
                                    timeout: timeout
                                }),
                                success: function (fullModels) {
                                    // MERGE into cache
                                    if (!cache[deviceKey]) cache[deviceKey] = {};
                                    cache[deviceKey][id] = fullModels;

                                    const modelKeys = fullModels
                                        ? Object.keys(fullModels).filter(m => m !== 'info')
                                        : [];
                                    if (modelKeys.length === 0) {
                                        // Deep scan found nothing (device offline/busy or wrong
                                        // unit id). Keep the saved selection as a ghost and prompt
                                        // a re-scan instead of showing an empty dropdown.
                                        $mod.empty().append('<option value="">-- Select Model --</option>');
                                        if (node.selectedModel) {
                                            const ghostLabel = node.selectedModelLabel || node.selectedModel;
                                            $mod.append($('<option>', { value: node.selectedModel, text: ghostLabel, selected: true }));
                                            $mod.val(node.selectedModel).trigger('change');
                                        }
                                        $mod.append('<option value="" disabled>No models found — device offline? Click "Scan Network" to refresh</option>');
                                        return;
                                    }
                                    populateModelsDropdown(fullModels, currentMod);
                                },
                                error: function () {
                                    RED.notify("Failed to load models for device", "error");
                                    $mod.empty().append('<option value="">Error loading models</option>');
                                }
                            });

                        } else if (deviceData) {
                            // Already cached
                            populateModelsDropdown(deviceData, currentMod);
                        } else {
                            // Ghost Device
                            if (node.selectedModel) {
                                const ghostLabel = node.selectedModelLabel || node.selectedModel;
                                $mod.append($('<option>', { value: node.selectedModel, text: ghostLabel, selected: true }));
                            }
                        }
                    }
                });

                // Models -> Points
                $("#node-input-selectedModel").change(function () {
                    const mid = $(this).val();
                    if (mid) node.selectedModelLabel = $(this).find("option:selected").text();

                    const $pt = $("#node-input-selectedPoint");
                    const currentPt = $pt.val();
                    $pt.empty().append('<option value="">-- Select Point --</option>');

                    if (!mid) return;

                    // Abort previous request if pending
                    if (node.currentModelRequest) {
                        node.currentModelRequest.abort();
                    }

                    // Show loading state
                    $pt.append('<option value="" disabled>Loading points...</option>');
                    $pt.prop('disabled', true);

                    // Get implemented points from scan cache
                    const deviceKey = $("#node-input-selectedDevice").val();
                    let implementedPoints = null;

                    if (deviceKey) {
                        // Value is "ip:port:unitId" (e.g. 1.2.3.4:502:1)
                        // We need to split properly.
                        // Last part is UnitID. Everything before is IP:Port

                        const parts = deviceKey.split(':');
                        const id = parts.pop(); // Remove last element (UnitId)
                        const key = parts.join(':'); // Rejoin rest (IP:Port)

                        // Check nested cache structure [IP:PORT][ID][ModelID]
                        if (currentNetworkMap &&
                            currentNetworkMap[key] &&
                            currentNetworkMap[key][id] &&
                            currentNetworkMap[key][id][mid]) {

                            implementedPoints = currentNetworkMap[key][id][mid].implementedPoints;
                            console.log(`[SunSpec UI] Model ${mid}: Loaded ${implementedPoints ? implementedPoints.length : 'null'} implemented points from cache.`);
                        } else {
                            console.log(`[SunSpec UI] Model ${mid}: No scan cache found at ${key}[${id}][${mid}]`);
                        }
                    }

                    node.currentModelRequest = $.getJSON('sunspec-scan/models', function (allModels) {
                        node.currentModelRequest = null;
                        // Clear loading state
                        $pt.empty().append('<option value="">-- Select Point --</option>');
                        $pt.prop('disabled', false);

                        const mDef = allModels[mid];
                        if (mDef) {
                            const filterOn = $("#node-input-filterImplemented").is(":checked");
                            // Sort Points Alphabetically
                            const sortedPoints = mDef.group.points.sort((a, b) => (a.label || a.name).localeCompare(b.label || b.name));
                            let filteredCount = 0;
                            let totalCount = 0;

                            sortedPoints.forEach(p => {
                                // Filter out Scale Factors and Pads
                                if (p.type === 'sunssf' || p.type === 'pad') return;

                                totalCount++;

                                // Filter out unimplemented points if we have scan data
                                if (filterOn && implementedPoints && !implementedPoints.includes(p.name)) {
                                    filteredCount++;
                                    return;
                                }

                                // Priority: desc > label > name
                                const rawLabel = p.desc || p.label || p.name;
                                // Only format if it looks like a crude identifier (no spaces, snake_case)
                                // and doesn't look like a good sentence.
                                let label = rawLabel;
                                if (!p.desc && !p.label) {
                                    label = formatLabel(rawLabel);
                                }
                                $pt.append($('<option>', { value: p.name, text: label }));
                            });

                            // Add feedback message if filtering occurred
                            if (implementedPoints && filteredCount > 0) {
                                $pt.prepend(`<option value="" disabled>✓ Filtered ${filteredCount} unimplemented point${filteredCount > 1 ? 's' : ''}</option>`);
                            }
                        }

                        // Restore
                        // Restore only if we are on the configured model
                        if (mid == node.selectedModel) {
                            if (currentPt && $pt.find(`option[value='${currentPt}']`).length > 0) $pt.val(currentPt);
                            else if (node.selectedPoint && $pt.find(`option[value='${node.selectedPoint}']`).length > 0) $pt.val(node.selectedPoint);
                            else if (node.selectedPoint) {
                                const ghostLabel = node.selectedPointLabel || node.selectedPoint;
                                $pt.append($('<option>', { value: node.selectedPoint, text: ghostLabel, selected: true }));
                            }
                        }
                    }).fail(function () {
                        // Error handler - always re-enable dropdown
                        $pt.empty().append('<option value="">-- Select Point --</option>');
                        $pt.append('<option value="" disabled>⚠ Error loading points</option>');
                        $pt.prop('disabled', false);
                    });
                });

                // Point Change -> Save Label
                $("#node-input-selectedPoint").change(function () {
                    if ($(this).val()) node.selectedPointLabel = $(this).find("option:selected").text();
                });

                // --- Editable List (Custom List Mode) ---

                $("#node-input-outputList-container").editableList({
                    addItem: function (container, i, item) {
                        const row = $('<div/>').appendTo(container);
                        $('<span/>', { style: "font-weight:bold; margin-right:10px;" }).text(item.label || "Item " + (i + 1)).appendTo(row);
                        $('<span/>', { style: "font-size:0.8em; color:#666;" }).text(`${item.device} [${item.model}/${item.point}]`).appendTo(row);

                        // Hidden inputs for persist
                        $('<input/>', { type: "hidden", class: "node-input-list-device", value: item.device }).appendTo(row);
                        $('<input/>', { type: "hidden", class: "node-input-list-id", value: item.id }).appendTo(row);
                        $('<input/>', { type: "hidden", class: "node-input-list-model", value: item.model }).appendTo(row);
                        $('<input/>', { type: "hidden", class: "node-input-list-point", value: item.point }).appendTo(row);
                    },
                    removable: true,
                    sortable: true
                });

                // Populate List
                if (node.outputList) {
                    for (var i = 0; i < node.outputList.length; i++) {
                        $("#node-input-outputList-container").editableList('addItem', node.outputList[i]);
                    }
                }

                // "Add to List" Button Handler
                $("#btn-add-to-list").click(function () {
                    const dev = $("#node-input-selectedDevice").val();
                    const mod = $("#node-input-selectedModel").val();
                    const pt = $("#node-input-selectedPoint").val();

                    const devText = $("#node-input-selectedDevice option:selected").text();
                    const modText = $("#node-input-selectedModel option:selected").text();
                    const ptText = $("#node-input-selectedPoint option:selected").text();

                    if (!dev || !mod || !pt) {
                        RED.notify("Please select Device, Model, and Point first.", "warning");
                        return;
                    }

                    // B2 FIX: Handle 3-part format (IP:PORT:UNITID)
                    const devParts = dev.split(':');
                    const defaultId = devParts.pop(); // Last part is UNITID
                    if (devParts.length > 1) devParts.pop(); // Discard PORT
                    const ip = devParts.join(':');
                    const overrideId = $("#node-input-selectedId").val();
                    const id = overrideId || defaultId;

                    const item = {
                        device: ip,
                        id: id,
                        model: mod,
                        point: pt,
                        label: `${modText} - ${ptText}`
                    };

                    $("#node-input-outputList-container").editableList('addItem', item);
                    RED.notify("Added to list", "success");
                });
                // B1 FIX: Removed automatic Settings-tab port override on device selection.
                // The port is already encoded in selectedDevice (IP:PORT:ID) and parsed correctly
                // by the runtime and lazy loader. Overwriting the Settings tab port is confusing
                // because it affects ALL modes, not just the selected device.

                // MANAGE DEVICES LOGIC
                function refreshManageList() {
                    const $list = $("#saved-device-list");
                    $list.empty();
                    if (savedDevices.length === 0) {
                        $list.append('<li style="color:#999; text-align:center; padding:20px;">No saved devices</li>');
                    } else {
                        savedDevices.forEach(d => {
                            const li = $('<li>').css({ padding: '8px', borderBottom: '1px solid #eee', display: 'flex', justifyContent: 'space-between', alignItems: 'center' });
                            const info = $('<div>').html(`<b>${d.name}</b><br><small>${d.ip}:${d.port} ID:${d.unitId}</small>`);
                            const btns = $('<div>');
                            // Edit Btn
                            $('<button>').addClass('red-ui-button red-ui-button-small').html('<i class="fa fa-pencil"></i>')
                                .click(() => {
                                    $("#manage-device-name").val(d.name);
                                    $("#manage-device-ip").val(d.ip);
                                    $("#manage-device-port").val(d.port);
                                    $("#manage-device-unitId").val(d.unitId);
                                    $("#btn-save-device").data('id', d.id).html('<i class="fa fa-save"></i> Update');
                                }).appendTo(btns);
                            // Delete Btn
                            $('<button>').addClass('red-ui-button red-ui-button-small').css({ marginLeft: '5px', color: '#a00' }).html('<i class="fa fa-trash"></i>')
                                .click(() => {
                                    console.log("[SunSpec Client] Delete clicked for", d);
                                    if (!d.id) {
                                        RED.notify("Error: Device has no ID, cannot delete.", "error");
                                        return;
                                    }
                                    if (confirm("Delete this device?")) {
                                        $.ajax({
                                            url: 'sunspec-scan/devices/' + d.id,
                                            type: 'DELETE',
                                            success: () => {
                                                RED.notify("Device deleted.", "success");
                                                // Refresh
                                                $.getJSON('sunspec-scan/devices', function (devs) {
                                                    savedDevices = devs || [];
                                                    refreshManageList();
                                                    populateDeviceSelect();
                                                });
                                            },
                                            error: (jqXHR, textStatus, errorThrown) => {
                                                console.error("Delete failed:", textStatus, errorThrown);
                                                RED.notify("Delete failed: " + textStatus, "error");
                                            }
                                        });
                                    }
                                }).appendTo(btns);

                            li.append(info).append(btns);
                            $list.append(li);
                        });
                    }
                }

                $("#btn-manage-devices").click(function (e) {
                    e.preventDefault();
                    $("#dialog-manage-devices").dialog("open");
                    refreshManageList();
                });

                $("#dialog-manage-devices").dialog({
                    autoOpen: false,
                    modal: true,
                    width: 500,
                    close: function () {
                        // Populate select on close to reflect changes
                        populateDeviceSelect();
                    }
                });

                $("#btn-clear-manage-form").click(function () {
                    $("#manage-device-name").val('');
                    $("#manage-device-ip").val('');
                    $("#manage-device-port").val('502');
                    $("#manage-device-unitId").val('1');
                    $("#btn-save-device").removeData('id').html('<i class="fa fa-save"></i> Save Device');
                });

                $("#btn-save-device").click(function () {
                    const name = $("#manage-device-name").val();
                    const ip = $("#manage-device-ip").val();
                    const port = $("#manage-device-port").val();
                    const unitId = $("#manage-device-unitId").val();
                    const id = $(this).data('id');

                    if (!ip) { RED.notify("IP Address required", "error"); return; }

                    const payload = { name, ip, port, unitId };
                    const method = id ? 'PUT' : 'POST';
                    const url = 'sunspec-scan/devices' + (id ? '/' + id : '');

                    $.ajax({
                        url: url,
                        type: method,
                        contentType: "application/json",
                        data: JSON.stringify(payload),
                        success: function () {
                            RED.notify("Device Saved", "success");
                            $("#btn-clear-manage-form").click();
                            // Refresh List
                            $.getJSON('sunspec-scan/devices', function (devs) {
                                savedDevices = devs || [];
                                refreshManageList();
                            });
                        },
                        error: function (xhr) {
                            RED.notify("Error: " + xhr.responseText, "error");
                        }
                    });
                });
            } catch (e) {
                console.error("[SunSpec] oneditprepare crashed:", e);
                RED.notify("Node configuration failed to load: " + e.message, "error");
            }
        },
        oneditsave: function () {
            const listItems = $("#node-input-outputList-container").editableList('items');
            const node = this;
            node.outputList = [];
            listItems.each(function (i) {
                const item = $(this);
                node.outputList.push({
                    device: item.find(".node-input-list-device").val(),
                    id: item.find(".node-input-list-id").val(),
                    model: item.find(".node-input-list-model").val(),
                    point: item.find(".node-input-list-point").val()
                });
            });

            // Sync ip/port/unitId from selectedDevice so runtime config stays consistent
            if (node.readMode === 'parameter' && node.selectedDevice) {
                const parts = node.selectedDevice.split(':');
                const id = parts.pop();   // Last part is UNITID
                if (parts.length > 1) {
                    node.port = parts.pop(); // PORT
                }
                node.ip = parts.join(':'); // IP
                node.unitId = id;
            }
        }
    });
</script>

<script type="text/html" data-template-name="sunspec-scan">
<style>
@keyframes progress-indeterminate { 0% { transform: translateX(-100%);} 100% { transform: translateX(200%);} }
.ss-step{background:var(--red-ui-secondary-background);border:1px solid var(--red-ui-form-input-border-color,#ccc);border-radius:6px;padding:10px 14px;margin-bottom:14px;}
.ss-step-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:bold;color:var(--red-ui-primary-text);}
.ss-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#4a90d9;color:#fff;font-size:12px;font-weight:bold;}
.ss-help{font-size:0.8em;color:var(--red-ui-secondary-text);margin:2px 0 8px 0;}
.ss-tip{position:relative;display:inline-block;margin-left:4px;color:var(--red-ui-secondary-text);cursor:help;}
.ss-tip .ss-bub{visibility:hidden;opacity:0;position:absolute;z-index:1000;left:18px;top:-4px;width:240px;background:var(--red-ui-popover-background,#1a1a1a);color:var(--red-ui-popover-color,#fff);border:1px solid var(--red-ui-border-color,#444);border-radius:4px;padding:6px 9px;font-size:0.78em;font-weight:normal;line-height:1.45;white-space:normal;transition:opacity .1s;}
.ss-tip:hover .ss-bub{visibility:visible;opacity:1;}
.ss-adv-h{cursor:pointer;color:var(--red-ui-secondary-text);font-size:0.85em;user-select:none;padding:4px 0;}
.ss-chev{transition:transform .12s;}
.ss-chev.open{transform:rotate(90deg);}
</style>
    <!-- TABS -->
<div class="form-row">
    <ul style="margin-bottom: 14px;" id="node-input-sunspec-tabs"></ul>
</div>

<div id="node-input-tabs-content" style="min-height: 170px;">

    <!-- TAB: SCANNER (Main) -->
    <div id="sunspec-tab-scanner" style="display:none">
        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="Name">
        </div>

        <div class="form-row">
            <label for="node-input-readMode"><i class="fa fa-cogs"></i> Mode
                <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Read a single value, read a list of values as an array, or scan the network to discover devices.</span></span>
            </label>
            <select id="node-input-readMode">
                <option value="parameter">Read a single value</option>
                <option value="list">Read a list of values</option>
                <option value="scan">Scan the network for devices</option>
            </select>
        </div>

        <!-- STEP 1: FIND DEVICE -->
        <div class="ss-step">
            <div class="ss-step-h"><span class="ss-num">1</span> Find your device</div>
            <div class="form-row">
                <label>&nbsp;</label>
                <div style="display:inline-block;">
                    <button id="btn-scan-network" class="red-ui-button"><i class="fa fa-search"></i> Scan Network</button>
                    <button id="btn-stop-scan" class="red-ui-button" style="margin-left:10px; background-color:#ad1625; color:white; display:none;"><i class="fa fa-stop"></i> Stop</button>
                </div>
            </div>
            <div class="form-row" id="scan-progress-bar" style="display:none;">
                <label>&nbsp;</label>
                <div style="display:inline-block; width:70%;">
                    <div style="width:100%; background-color:#ddd; height:20px; border-radius:3px; overflow:hidden;">
                        <div style="width:100%; height:100%; background-color:#5bc0de; animation: progress-indeterminate 2s infinite linear; transform-origin: 0% 50%;"></div>
                    </div>
                    <div id="scan-status-text" style="font-size:0.8em; color:#666; text-align:center; margin-top:2px;">Initializing scan...</div>
                </div>
            </div>
            <p class="ss-help">Discovers SunSpec devices on your network and lists them below.</p>

            <div class="form-row param-mode-only list-mode-only mode-group">
                <label for="node-input-selectedDevice"><i class="fa fa-server"></i> Device
                    <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Pick a device found by a scan. The gear button manages your saved devices.</span></span>
                </label>
                <div style="display:inline-block; width:70%;">
                    <select id="node-input-selectedDevice" style="width:calc(100% - 40px);">
                        <option value="">(Scan to populate)</option>
                    </select>
                    <button id="btn-manage-devices" class="red-ui-button" title="Manage Saved Devices" style="width:35px; margin-left:5px;"><i class="fa fa-cog"></i></button>
                </div>
            </div>
            <input type="hidden" id="node-input-selectedId">

            <div class="ss-adv-h" id="ss-adv-toggle"><i class="fa fa-caret-right ss-chev"></i> Network scan range / manual address</div>
            <div id="ss-adv-body" style="display:none; padding-top:6px;">
                <div class="form-row">
                    <label for="node-input-ip"><i class="fa fa-globe"></i> IP Address
                        <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">A single IP, a range (192.168.1.10-20), CIDR (192.168.1.0/24), or empty to scan your local subnet.</span></span>
                    </label>
                    <input type="text" id="node-input-ip" placeholder="0.0.0.0 (Empty = Scan Local)">
                </div>
                <div class="form-row">
                    <label for="node-input-unitId"><i class="fa fa-bookmark"></i> Unit ID
                        <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Modbus address behind a gateway. Empty = scan 1-247. Single: 126. List: 1, 50, 126. Range: 1-10.</span></span>
                    </label>
                    <input type="text" id="node-input-unitId" placeholder="1, 126 or 1-10 (Empty = All)">
                </div>
            </div>
        </div>

        <!-- STEP 2: CHOOSE READING -->
        <div class="ss-step param-mode-only list-mode-only mode-group">
            <div class="ss-step-h"><span class="ss-num">2</span> Choose what to read</div>
            <p class="ss-help">Run a scan first to populate these.</p>
            <div class="form-row">
                <label for="node-input-selectedModel"><i class="fa fa-cube"></i> SunSpec model
                    <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">A group of related readings defined by SunSpec, e.g. Inverter, Meter or Battery.</span></span>
                </label>
                <select id="node-input-selectedModel" style="width:70%;">
                    <option value="">-- Select Model --</option>
                </select>
            </div>
            <div class="form-row">
                <label for="node-input-selectedPoint"><i class="fa fa-crosshairs"></i> Reading
                    <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">A single value within the model, e.g. AC Power (W), Frequency (Hz) or Voltage (V).</span></span>
                </label>
                <select id="node-input-selectedPoint" style="width:70%;">
                    <option value="">-- Select Point --</option>
                </select>
            </div>
            <div class="form-row">
                <label for="node-input-filterImplemented" style="width:auto;"><i class="fa fa-filter"></i> Usable only
                    <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Only show readings this device actually reports, hiding unimplemented/placeholder registers. Needs a scan first.</span></span>
                </label>
                <input type="checkbox" id="node-input-filterImplemented" style="width:auto; margin-left:0;">
                <label for="node-input-filterImplemented" style="width:auto; margin-left:8px;">Only show readings this device actually reports</label>
            </div>
            <div class="form-row list-mode-only mode-group">
                <label>&nbsp;</label>
                <button id="btn-add-to-list" class="red-ui-button"><i class="fa fa-plus"></i> Add to List</button>
            </div>
        </div>

        <!-- STEP 3: OPTIONS -->
        <div class="ss-step">
            <div class="ss-step-h"><span class="ss-num">3</span> Options</div>
            <div class="form-row">
                <label for="node-input-triggerMode"><i class="fa fa-cogs"></i> Schedule
                    <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Auto-read on a fixed interval, or read only when a message arrives at the input.</span></span>
                </label>
                <select id="node-input-triggerMode" style="width: 70%;">
                    <option value="auto">Auto-Read Interval</option>
                    <option value="inject">Inject Only (No Polling)</option>
                </select>
            </div>
            <div class="form-row" id="pacing-row">
                <label for="node-input-pacing"><i class="fa fa-refresh"></i> Auto-read every
                    <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Seconds between reads. 0 or empty disables polling (read only on input).</span></span>
                </label>
                <input type="text" id="node-input-pacing" placeholder="0 = disable" style="width:110px;"> <span style="color:var(--red-ui-secondary-text);">seconds</span>
            </div>
            <div class="form-row param-mode-only list-mode-only mode-group">
                <label for="node-input-roundDecimals"><i class="fa fa-calculator"></i> Round output</label>
                <input type="checkbox" id="node-input-roundDecimals" style="width:auto; margin-left:0;">
                <label for="node-input-roundDecimals" style="width:auto; margin-left:8px;">Round to 2 decimal places</label>
            </div>
        </div>

        <!-- OUTPUT LIST (List Mode Only) -->
        <fieldset class="list-mode-only mode-group">
            <legend>Output List</legend>
            <div class="form-tips">Items will be output as an array in this order.</div>
            <div class="form-row node-input-outputList-container-row">
                <ol id="node-input-outputList-container"></ol>
            </div>
        </fieldset>
    </div>

    <!-- TAB: SETTINGS (Advanced) -->
    <div id="sunspec-tab-settings" style="display:none">
        <div class="form-row">
            <label for="node-input-port"><i class="fa fa-random"></i> Port
                <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">Modbus TCP port. 502 is standard SunSpec; some gateways (e.g. Schneider Conext) expose a proprietary map on 503.</span></span>
            </label>
            <input type="number" id="node-input-port" placeholder="502">
        </div>
        <div class="form-row">
            <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout (ms)
                <span class="ss-tip"><i class="fa fa-question-circle"></i><span class="ss-bub">How long to wait for a device reply. Default 8000 ms; values below 4000 ms are raised automatically.</span></span>
            </label>
            <input type="number" id="node-input-timeout" placeholder="8000">
        </div>
        <div class="form-tips">Tip: the device, model and reading are chosen on the Scanner tab. Hover any <i class="fa fa-question-circle"></i> for help.</div>
    </div>
</div>

<!-- DEVICE MANAGEMENT MODAL -->
<div id="dialog-manage-devices" style="display:none">
    <div class="form-row">
        <label for="manage-device-name"><i class="fa fa-tag"></i> Name</label>

    </div>
    <div class="form-row">
        <label for="manage-device-ip"><i class="fa fa-globe"></i> IP</label>

    </div>
    <div class="form-row">
        <label for="manage-device-port"><i class="fa fa-random"></i> Port</label>
        <input type="number" id="manage-device-port" placeholder="502" style="width:80px">
        <label for="manage-device-unitId" style="width:auto; margin-left:10px;">ID</label>
        <input type="number" id="manage-device-unitId" placeholder="1" style="width:60px">

    <div class="form-row" style="text-align:right;">
        <button id="btn-save-device" class="red-ui-button"><i class="fa fa-save"></i> Save Device</button>

            <!-- Items injected here -->
            <li style="color:#999; text-align:center; padding:20px;">No saved devices</li>
        </ul>
    </div>
</div>
</script>

<script type="text/html" data-help-name="sunspec-scan">
    <p>Scans a SunSpec device via Modbus TCP and outputs identified models.</p>
    
    <h3>Modes</h3>
    <dl>
        <dt>Full Scan</dt>
        <dd>Scans the provided IP/Range and outputs ONLY model data found on the network.</dd>
        
        <dt>Read Single Parameter</dt>
        <dd>Read a single SCALED value. Use the "Unit ID" field to target a specific slave ID if needed.</dd>
        
        <dt>Read Custom List</dt>
        <dd>Read multiple parameters and output them as a fixed-order array.</dd>
    </dl>
</script>
